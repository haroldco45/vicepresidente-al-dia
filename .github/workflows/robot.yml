name: Robot Vicepresidente al Día

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:         # botón para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias, fotos y videos
        run: node robot/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "Robot Vibras Positivas"
          git config user.email "robot@vibraspositivashm.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin novedades"
          else
            git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
